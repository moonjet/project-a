<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.6.0/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-base-200">
    
    <!-- Theme Toggle (Top Right) -->
    <div class="fixed top-4 right-4 z-50">
        <label class="swap swap-rotate btn btn-circle btn-ghost">
            <input type="checkbox" id="themeToggle" />
            <svg class="swap-off fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/></svg>
            <svg class="swap-on fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/></svg>
        </label>
    </div>

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-8">AI Tools Directory</h1>
        <div id="toolsContainer"></div>
    </div>

    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-theme', savedTheme);
        themeToggle.checked = savedTheme === 'dark';
        
        themeToggle.addEventListener('change', () => {
            const newTheme = themeToggle.checked ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // Category theme colors (DaisyUI classes)
        const categoryThemes = {
            'AI Client Apps (macOS)': 'bg-gradient-to-br from-blue-400 to-indigo-500 text-white',
            'TTS & Voice AI': 'bg-gradient-to-r from-purple-500 to-pink-500 text-white',
            'AI Coding & IDEs': 'bg-gradient-to-r from-emerald-500 to-teal-600 text-white',
            'Video/Image Production': 'bg-gradient-to-br from-orange-500 to-red-500 text-white',
            'AI Notebooks & Assistants': 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white',
            'Workflow & Automation': 'bg-gradient-to-br from-lime-400 to-green-500',
            'LLM Free APIs': 'bg-base-100 border-l-4 border-primary shadow-xl hover:shadow-2xl',
            'default': 'bg-base-100 shadow-xl hover:shadow-2xl'
        };

        // Load and render tools
        fetch('ai-tools-directory.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('toolsContainer');
                
                data.categories.forEach(category => {
                    // Category header
                    const categorySection = document.createElement('div');
                    categorySection.className = 'mb-12';
                    categorySection.innerHTML = `
                        <h2 class="text-3xl font-bold mb-2">${category.name}</h2>
                        <p class="text-base-content/70 mb-6">${category.description}</p>
                    `;
                    
                    // Tools grid
                    const toolsGrid = document.createElement('div');
                    toolsGrid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6';
                    
                    // Get theme for this category
                    const themeClass = categoryThemes[category.name] || categoryThemes['default'];
                    
                    // Create individual tool cards
                    category.tools.forEach(tool => {
                        const card = document.createElement('div');
                        card.className = `card ${themeClass} transition-all duration-300 hover:scale-105`;
                        card.innerHTML = `
                            <div class="card-body p-6">
                                <h3 class="card-title text-lg mb-2">${tool.name}</h3>
                                <p class="text-sm opacity-90 flex-grow">${tool.desc}</p>
                                <div class="card-actions justify-end mt-4">
                                    <a href="${tool.url.startsWith('http') ? tool.url : 'https://' + tool.url}" 
                                       target="_blank" 
                                       class="btn btn-sm ${themeClass.includes('text-white') ? 'btn-outline btn-white' : 'btn-primary'}">
                                        Visit →
                                    </a>
                                </div>
                            </div>
                        `;
                        toolsGrid.appendChild(card);
                    });
                    
                    categorySection.appendChild(toolsGrid);
                    container.appendChild(categorySection);
                });
            })
            .catch(error => console.error('Error loading tools:', error));
    </script>
</body>
</html>
