<!DOCTYPE html>
<html lang="en" data-theme="light">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Directory</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.6.0/dist/full.min.css" rel="stylesheet" />
    <link href="themes.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <style>
        :root {
            --logo-panel-width: 26%;
            --corner-badge-height: 22px;
            --corner-badge-min-width: 54px;
            --corner-badge-max-width: 120px;
            --corner-badge-padding: 0 0.6rem;
            --corner-badge-font-size: 0.65rem;
            --corner-btn-width: 52px;
            --corner-btn-height: 22px;
            --corner-btn-padding: 0.25rem;
            --corner-radius: 12px;
            --visit-btn-min-width: 120px;
            --visit-btn-max-width: 320px;
            --animation-speed-fast: 0.2s;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, oklch(var(--b1)) 0%, oklch(from oklch(var(--b1)) calc(l * 0.97) c h) 100%);
            background-attachment: fixed;
        }

        h1, h2, h3 { 
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.02em; 
        }

        .main-content { flex: 1; }

        .navbar-extended {
            background: linear-gradient(145deg, oklch(var(--b1)) 0%, oklch(from oklch(var(--b1)) calc(l * 0.985) c h) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid oklch(var(--bc) / 0.08);
            box-shadow: 0 2px 8px oklch(var(--bc) / 0.04);
            padding: 0.75rem 0;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.1;
            position: relative;
            padding-left: 1rem;
        }

        .hero-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, oklch(var(--p)), oklch(var(--s)), oklch(var(--a)));
            border-radius: 9999px;
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 1.5rem; }
            .hero-title::before { width: 3px; }
            .theme-dropdown {
              width: 280px;}
            .theme-dropdown .menu {
             grid-template-columns: repeat(2, 1fr);}
             width: 280px;
            }
    
        .stats-compact {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.8;
            font-weight: 600;
        }

        .stat-number { color: oklch(var(--p)); }

        .filter-bar {
            position: sticky;
            top: 65px;
            z-index: 40;
            background: oklch(var(--b1) / 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid oklch(var(--bc) / 0.08);
            padding: 0.5rem 0;
            margin-bottom: 1.5rem;
        }

        .filter-chips-container {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
        }

        .filter-chips-container::-webkit-scrollbar { display: none; }

        .filter-chip {
            flex-shrink: 0;
            padding: 0.35rem 0.85rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid oklch(var(--bc) / 0.1);
            background: oklch(var(--b2) / 0.5);
            color: oklch(var(--bc) / 0.7);
            white-space: nowrap;
        }

        .filter-chip:hover {
            border-color: oklch(var(--p) / 0.3);
            background: oklch(var(--b2));
        }

        .filter-chip.active {
            background: oklch(var(--p));
            color: oklch(var(--pc));
            border-color: oklch(var(--p));
        }

        .badge-filters-container {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .badge-chip {
            flex-shrink: 0;
            padding: 0.3rem 0.65rem;
            border-radius: 0.4rem;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1.5px solid oklch(var(--bc) / 0.15);
            background: transparent;
            color: oklch(var(--bc) / 0.6);
            white-space: nowrap;
        }


        .badge-chip:hover {
            border-color: oklch(var(--s) / 0.4);
            background: oklch(var(--s) / 0.1);
            color: oklch(var(--bc));
        }

        .badge-chip.active {
            background: oklch(var(--s));
            color: oklch(var(--sc));
            border-color: oklch(var(--s));
        }

        .clear-filters-btn {
            padding: 0.3rem 0.65rem;
            border-radius: 0.4rem;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            background: oklch(var(--er) / 0.1);
            color: oklch(var(--er));
            border: none;
        }

        .result-count {
            font-size: 0.75rem;
            opacity: 0.7;
            font-weight: 500;
            white-space: nowrap;
        }

        .category-header.color-primary h2 { color: oklch(var(--p) / 0.85); }
        .category-header.color-info h2 { color: oklch(var(--in) / 0.85); }
        .category-header.color-accent h2 { color: oklch(var(--a) / 0.85); }
        .category-header.color-secondary h2 { color: oklch(var(--s) / 0.85); }

        .category-header h2 {
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .category-header h2 { font-size: 1.25rem; }
            .badge-filters-container { flex-wrap: nowrap; }
        }

        .category-header {
            margin-bottom: 1rem;
            padding-left: 0.5rem;
        }

        .category-header p { display: none; }

        @media (max-width: 767px) {
            .category-tools-grid {
                display: flex !important;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                gap: 1rem;
                padding-bottom: 1rem;
                scrollbar-width: none;
            }

            .category-tools-grid::-webkit-scrollbar { display: none; }

            .tool-card {
                flex: 0 0 85%;
                scroll-snap-align: start;
                max-width: 340px;
            }
        }

        @media (min-width: 768px) {
            .category-tools-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
        }

        @media (min-width: 1024px) {
            .category-tools-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Pricing pills - same height as corner badge (22px) */
        .pricing-pills {
            display: flex;
            gap: 0;
            align-items: center;
            height: var(--corner-badge-height);
            margin-top: 0.5rem;
        }

        .pricing-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 0.6rem;
            font-size: 0.65rem;
            font-weight: 700;
            white-space: nowrap;
            border: none;
            opacity: 0.9;
            flex: 1;
            min-width: fit-content;
            height: 100%;
            transition: all 0.2s ease;
        }

        .pricing-pill:first-child {
            border-top-left-radius: 0.35rem;
            border-bottom-left-radius: 0.35rem;
        }

        .pricing-pill:last-child {
            border-top-right-radius: 0.35rem;
            border-bottom-right-radius: 0.35rem;
        }

        .pricing-pill.free {
            background: oklch(var(--su));
            color: oklch(var(--suc));
        }

        .pricing-pill.tier-1 {
            background: oklch(var(--p));
            color: oklch(var(--pc));
        }

        .pricing-pill.tier-2 {
            background: oklch(var(--s));
            color: oklch(var(--sc));
        }

        .pricing-pill.tier-3 {
            background: oklch(var(--a));
            color: oklch(var(--ac));
        }

        .pricing-pill:hover {
            opacity: 1;
            transform: scale(1.02);
        }

        .theme-dropdown {
        max-height: 300px;
        overflow-y: auto;
        width: 400px;                          /* Wide enough for 3 columns */
        right: 0;                              /* Align to right edge */
        }

        .theme-dropdown .menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 equal columns */
            gap: 0.25rem;                          /* Small gap */
            padding: 0.5rem;
        }

        .theme-dropdown .menu li {
            margin: 0;
        }

        .theme-dropdown .theme-option {
            font-size: 0.75rem;                    /* Smaller text */
            padding: 0.4rem 0.5rem;
            white-space: nowrap;
            justify-content: flex-start;
        }

        .theme-dropdown .theme-dot {
            width: 10px;                           /* Smaller dots */
            height: 10px;
        }


        .theme-option {
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .theme-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .corner-badge {
            position: absolute;
            top: -2px;
            left: -2px;
            border-bottom-right-radius: var(--corner-radius);
            border: 1px solid;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            z-index: 10;
            box-shadow: 0 2px 8px oklch(var(--bc) / 0.15);
            min-width: var(--corner-badge-min-width);
            max-width: var(--corner-badge-max-width);
            height: var(--corner-badge-height);
            padding: var(--corner-badge-padding);
            font-size: var(--corner-badge-font-size);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .corner-badge:hover {
            transform: scale(1.04);
            filter: brightness(1.08);
        }

        .corner-badge.badge-value {
            background: oklch(var(--s));
            color: oklch(var(--sc));
        }

        .corner-badge.badge-popular, .corner-badge.badge-best {
            background: oklch(var(--er));
            color: oklch(var(--erc));
        }

        .corner-badge.badge-new {
            background: oklch(var(--wa));
            color: oklch(var(--wac));
        }

        .corner-badge.badge-fast {
            background: oklch(var(--in));
            color: oklch(var(--inc));
        }

        .favorite-corner {
            position: absolute;
            top: 0;
            right: 0;
            border-bottom-left-radius: var(--corner-radius);
            padding: 0.25rem 0.5rem;
        }

        .favorite-star {
            font-size: 1.35rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            filter: drop-shadow(0 2px 4px oklch(var(--bc) / 0.2));
        }

        .favorite-star.unfavorited { color: oklch(var(--bc) / 0.3); }
        .favorite-star.favorited { color: oklch(var(--wa)); }

        .favorite-corner:hover .favorite-star {
            transform: scale(1.15) rotate(10deg);
        }

        .btn-visit, .btn-more {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.7rem;
            border: 1px solid oklch(var(--bc) / 0.1);
            background: oklch(var(--b3) / 0.8);
            color: oklch(var(--bc));
            transition: all 0.2s ease;
        }

        .btn-visit:hover, .btn-more:hover {
            transform: scale(1.03);
            background: oklch(var(--b3));
        }

        .btn-visit {
            min-width: var(--visit-btn-min-width);
            width: fit-content;
            height: var(--corner-btn-height);
            border-top-right-radius: var(--corner-radius);
            border-bottom-left-radius: 0.5rem;
            padding: 0 0.6rem;
            font-size: 0.65rem;
            white-space: nowrap;
        }

        .btn-more {
            width: var(--corner-btn-width);
            height: var(--corner-btn-height);
            border-top-left-radius: var(--corner-radius);
            border-bottom-right-radius: 0.5rem;
            padding: var(--corner-btn-padding);
        }

        .tool-card { 
            min-height: 180px;
            background: linear-gradient(145deg, oklch(var(--b1)) 0%, 
            oklch(from oklch(var(--b1)) calc(l * 1.25) c h) 100%);
            border: 1px solid oklch(var(--bc) / 0.01);
            position: relative;
            box-shadow: 0 1px 3px oklch(var(--bc) / 0.05);
            transition: all 0.2s ease;
        }
        

        .tool-card:hover {
            transform: translateY(-2px);
            box-shadow: 2 1px 1px oklch(var(--bc) / 0.10);
        }

        .modern-footer {
            background: linear-gradient(145deg, oklch(from oklch(var(--b1)) calc(l * 0.94) c h) 0%, oklch(from oklch(var(--b1)) calc(l * 0.92) c h) 100%);
            border-top: 1px solid oklch(var(--bc) / 0.08);
            padding: 3rem 0 1.5rem;
            margin-top: 3rem;
        }

        /* Modal styles */
        .modal-box { 
            max-width: 900px;
            width: 90vw;
            max-height: 85vh;
            padding: 0;
            overflow: hidden;
        }

        .modal-box-favorites {
            max-width: 1100px !important;
            width: 90vw;
            max-height: 85vh;
            padding: 0;
            overflow: hidden;
        }

        .modal-header {
            background: linear-gradient(135deg, oklch(var(--p) / 0.1) 0%, oklch(var(--s) / 0.05) 100%);
            border-bottom: 1px solid oklch(var(--bc) / 0.08);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .modal-logo {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            object-fit: contain;
            background: oklch(var(--b1));
            border-radius: 0.5rem;
            padding: 0.5rem;
        }

        .modal-title-section {
            flex: 1;
            min-width: 0;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            line-height: 1.2;
        }

        .modal-description {
            font-size: 0.85rem;
            opacity: 0.7;
            margin: 0.25rem 0 0 0;
        }

        .modal-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            background: oklch(var(--b2) / 0.3);
            border-bottom: 1px solid oklch(var(--bc) / 0.05);
        }

        .stat-box { text-align: center; }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.6;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .star-rating { color: oklch(var(--wa)); }

        .modal-content-scroll {
            max-height: calc(85vh - 300px);
            overflow-y: auto;
            padding: 1.5rem;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .pricing-card {
            background: oklch(var(--b2) / 0.5);
            border: 1px solid oklch(var(--bc) / 0.1);
            border-radius: 0.5rem;
            padding: 0.75rem;
            transition: all 0.2s ease;
        }

        .pricing-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px oklch(var(--bc) / 0.1);
            border-color: oklch(var(--p) / 0.3);
        }

        .pricing-tier-name {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.7;
            margin-bottom: 0.25rem;
        }

        .pricing-tier-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: oklch(var(--p));
            margin-bottom: 0.5rem;
        }

        .pricing-features {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.75rem;
            line-height: 1.6;
        }

        .pricing-features li {
            padding-left: 1rem;
            position: relative;
            margin-bottom: 0.25rem;
        }

        .pricing-features li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: oklch(var(--su));
            font-weight: bold;
        }

        .timeline-horizontal {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 1rem 0;
            scrollbar-width: thin;
        }

        .timeline-item-horizontal {
            flex-shrink: 0;
            min-width: 140px;
            background: oklch(var(--b2) / 0.3);
            border-radius: 0.5rem;
            padding: 0.75rem;
            border-left: 3px solid oklch(var(--p));
        }

        .timeline-date {
            font-size: 0.7rem;
            opacity: 0.6;
            font-weight: 600;
        }

        .timeline-version {
            font-size: 0.85rem;
            font-weight: 700;
            margin: 0.25rem 0;
        }

        .timeline-event {
            font-size: 0.75rem;
            opacity: 0.8;
            line-height: 1.4;
        }

        .section-header {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.7;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid oklch(var(--bc) / 0.1);
        }

        .modal-actions {
            background: oklch(var(--b1));
            border-top: 1px solid oklch(var(--bc) / 0.08);
            padding: 1rem 1.5rem;
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
        }

        .badge-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.6rem;
            background: oklch(var(--p) / 0.15);
            color: oklch(var(--p));
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="navbar navbar-extended sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between w-full">
                <h1 class="hero-title">AI Tools Directory</h1>

                <div class="flex items-center gap-4">
                    <div class="stats-compact hidden md:flex">
                        <span><span class="stat-number" id="toolCount">0</span>+ Tools</span>
                        <span>•</span>
                        <span><span class="stat-number" id="categoryCount">0</span> Categories</span>
                    </div>

                    <button onclick="showFavorites()" class="btn btn-ghost btn-circle relative">
                        <span class="text-2xl">★</span>
                        <span id="favCount" class="badge badge-sm badge-primary absolute -top-1 -right-1" style="display: none;">0</span>
                    </button>

                    <div class="dropdown dropdown-end">
                        <label tabindex="0" class="btn btn-ghost btn-circle">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                            </svg>
                        </label>
                        <ul tabindex="0" id="themeDropdown" class="dropdown-content menu p-2 shadow-2xl bg-base-100 rounded-box w-52 theme-dropdown"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="filter-bar">
        <div class="container mx-auto px-4 max-w-7xl">
            <div class="filter-chips-container" id="categoryFilters">
                <div class="filter-chip active" data-category="all">All</div>
            </div>

            <div class="badge-filters-container" id="badgeFilters">
                <div class="badge-chip" data-badge="recommended"> Recommended</div>
                <div class="badge-chip" data-badge="new"> New</div>
                <div class="badge-chip" data-badge="popular"> Popular</div>
                <div class="badge-chip" data-badge="open-source"> Open Source</div>
                <div class="badge-chip" data-badge="free"> Free</div>
                <button class="clear-filters-btn hidden" id="clearFilters">Clear All</button>
                <span class="result-count" id="resultCount"></span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="container mx-auto px-4 py-4 max-w-7xl">
            <div id="toolsContainer"></div>
            <div id="noResults" class="hidden text-center py-12">
                <p class="text-2xl opacity-60">No tools match your filters</p>
                <button onclick="clearAllFilters()" class="btn btn-primary mt-4">Clear Filters</button>
            </div>
        </div>
    </div>

    <footer class="modern-footer">
        <div class="container mx-auto px-4 max-w-7xl text-center">
            <p class="opacity-70">© <span id="currentYear"></span> AI Tools Directory</p>
        </div>
    </footer>

    <dialog id="toolModal" class="modal">
        <div class="modal-box">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2 z-10">✕</button>
            </form>
            <div id="modalContent"></div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <dialog id="favoritesModal" class="modal">
        <div class="modal-box modal-box-favorites">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2 z-10">✕</button>
            </form>

            <!-- Favorites Header (matching tool modal style) -->
            <div class="modal-header">
                <div class="modal-title-section">
                    <h3 class="modal-title"> Your Favorites</h3>
                    <p class="modal-description" id="favoritesCount">0 saved tools</p>
                </div>
            </div>

            <!-- Favorites Content (scrollable) -->
            <div class="modal-content-scroll" style="max-height: calc(85vh - 120px); padding: 1.5rem;">
                <div id="favoritesContent"></div>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script>
        let toolsData = null;
        let activeCategory = 'all';
        let activeBadges = [];
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

        const themes = [
            'light', 'dark', 'synthwave', 'cupcake', 
            'retro', 'valentine', 'forest',
            'lofi', 'pastel','dracula', 'cmyk', 'business', 
            'lemonade', 'night', 'dim', 'cyberpunk',
        ];

        const themeColors = {
            'light': '#e5e7eb', 'dark': '#1f2937', 'cupcake': '#fcd34d', 'bumblebee': '#fbbf24',
            'emerald': '#34d399', 'corporate': '#3b82f6', 'synthwave': '#e879f9', 'retro': '#f59e0b',
            'cyberpunk': '#facc15', 'valentine': '#ec4899', 'halloween': '#fb923c', 'garden': '#86efac',
            'forest': '#4ade80', 'aqua': '#22d3ee', 'lofi': '#a1a1aa', 'pastel': '#c084fc',
            'fantasy': '#f0abfc', 'wireframe': '#d1d5db', 'black': '#374151', 'luxury': '#fbbf24',
            'dracula': '#dc2626', 'cmyk': '#06b6d4', 'autumn': '#dc2626', 'business': '#1e40af',
            'acid': '#a3e635', 'lemonade': '#fde047', 'night': '#1e3a8a', 'coffee': '#78350f',
            'winter': '#3b82f6', 'dim': '#4b5563', 'nord': '#60a5fa', 'sunset': '#f87171'
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function initializeThemeDropdown() {
            const dropdown = document.getElementById('themeDropdown');
            const currentTheme = localStorage.getItem('theme') || 'light';

            dropdown.innerHTML = themes.map(theme => {
                const isActive = theme === currentTheme;
                return `
                    <li>
                        <a onclick="changeTheme('${theme}')" class="theme-option ${isActive ? 'active' : ''}">
                            <span class="theme-dot" style="background: ${themeColors[theme] || '#ccc'}"></span>
                            <span>${theme.charAt(0).toUpperCase() + theme.slice(1)}</span>
                            ${isActive ? '<span class="ml-auto">✓</span>' : ''}
                        </a>
                    </li>
                `;
            }).join('');

            document.documentElement.setAttribute('data-theme', currentTheme);
        }

        function changeTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            initializeThemeDropdown();
        }

        function updateFavCount() {
            const count = favorites.length;
            const badge = document.getElementById('favCount');
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function toggleFavorite(categoryName, toolName, event) {
            event.stopPropagation();
            const favKey = categoryName + '::' + toolName;
            const index = favorites.indexOf(favKey);

            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(favKey);
            }

            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavCount();

            // Update all star icons for this tool
            const stars = document.querySelectorAll(`[data-fav-key="${favKey}"]`);
            stars.forEach(star => {
                if (favorites.includes(favKey)) {
                    star.classList.remove('unfavorited');
                    star.classList.add('favorited');
                } else {
                    star.classList.remove('favorited');
                    star.classList.add('unfavorited');
                }
            });
        }

        function createToolCard(tool, category) {
            const isFav = favorites.includes(category.name + '::' + tool.name);
            const favKey = category.name + '::' + tool.name;

            const cornerBadge = tool.cornerBadge ? 
                `<div class="corner-badge badge-${tool.cornerBadge.toLowerCase()}" onclick="filterByBadge('${tool.cornerBadge.toLowerCase()}')">${escapeHtml(tool.cornerBadge)}</div>` : '';

            const cleanUrl = tool.url.replace(/^https?:\/\/(www\.)?/, '');
            const visitText = cleanUrl.split('/')[0];

            const pricingTiers = tool.pricing ? tool.pricing.split('/') : [];
            const pricingPills = pricingTiers.map((tier, index) => {
                const isFree = tier.toLowerCase() === 'free';
                const tierClass = isFree ? 'free' : 'tier-' + Math.min(index, 3);
                return `<span class="pricing-pill ${tierClass}">${escapeHtml(tier)}</span>`;
            }).join('');

            return `
                <div class="card shadow-xl tool-card">
                    <div class="flex h-full">
                        <div class="flex-shrink-0 relative flex flex-col" style="width: var(--logo-panel-width)">
                            ${cornerBadge}
                            <div class="flex-grow bg-base-100/50 p-2 flex items-center justify-center">
                                <img src="${tool.thumbnail}" alt="${escapeHtml(tool.name)}" class="max-w-full max-h-full object-contain">
                            </div>
                            <a href="${tool.url}" target="_blank" class="btn-visit" onclick="event.stopPropagation()">${escapeHtml(visitText)}</a>
                        </div>

                        <div class="flex-1 p-3 flex flex-col relative">
                            <div class="favorite-corner">
                                <span class="favorite-star ${isFav ? 'favorited' : 'unfavorited'}" 
                                      data-fav-key="${favKey}"
                                      onclick="toggleFavorite('${escapeHtml(category.name)}', '${escapeHtml(tool.name)}', event)">★</span>
                            </div>

                            <h3 class="font-bold text-lg mb-1 pr-12">${escapeHtml(tool.name)}</h3>
                            <p class="text-sm opacity-70 mb-2">${escapeHtml(tool.description)}</p>

                            ${tool.pricing ? `<div class="pricing-pills">${pricingPills}</div>` : ''}

                            <div class="flex items-center justify-end -mr-3 -mb-3 mt-auto">
                                <button class="btn-more" onclick="showToolModal('${escapeHtml(category.name)}', '${escapeHtml(tool.name)}')">More</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showToolModal(categoryName, toolName) {
            const category = toolsData.categories.find(c => c.name === categoryName);
            if (!category) return;

            const tool = category.tools.find(t => t.name === toolName);
            if (!tool) return;

            const isFav = favorites.includes(categoryName + '::' + toolName);
            const favKey = categoryName + '::' + toolName;

            let modalHTML = `
                <div class="modal-header">
                    <img src="${tool.thumbnail}" alt="${escapeHtml(tool.name)}" class="modal-logo">
                    <div class="modal-title-section">
                        <h3 class="modal-title">${escapeHtml(tool.name)}</h3>
                        <p class="modal-description">${escapeHtml(tool.description)}</p>
                    </div>
                </div>

                <div class="modal-stats">
                    <div class="stat-box">
                        <div class="stat-label">Rating</div>
                        <div class="stat-value star-rating">${tool.rating ? '⭐ ' + tool.rating : 'N/A'}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Category</div>
                        <div class="stat-value">${escapeHtml(category.name)}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Access</div>
                        <div class="stat-value">${tool.badges && tool.badges.includes('web') ? '🌐 Web' : '💻 App'}</div>
                    </div>
                </div>

                <div class="modal-content-scroll">
            `;

            if (tool.pricingTiers && tool.pricingTiers.length > 0) {
                modalHTML += '<div class="section-header">💰 Pricing</div>';
                modalHTML += '<div class="pricing-grid">';
                tool.pricingTiers.forEach(tier => {
                    modalHTML += `
                        <div class="pricing-card">
                            <div class="pricing-tier-name">${escapeHtml(tier.name)}</div>
                            <div class="pricing-tier-price">${escapeHtml(tier.price)}</div>
                            <ul class="pricing-features">
                                ${tier.features.map(f => `<li>${escapeHtml(f)}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                });
                modalHTML += '</div>';
            }

            if (tool.allBadges && tool.allBadges.length > 0) {
                modalHTML += '<div class="section-header">🏷️ Features</div>';
                modalHTML += '<div class="badge-pills">';
                tool.allBadges.forEach(badge => {
                    modalHTML += `<span class="badge-pill">${escapeHtml(badge)}</span>`;
                });
                modalHTML += '</div>';
            }

            if (tool.timeline && tool.timeline.length > 0) {
                modalHTML += '<div class="section-header" style="margin-top: 1.5rem;">📅 Timeline</div>';
                modalHTML += '<div class="timeline-horizontal">';
                tool.timeline.forEach(item => {
                    modalHTML += `
                        <div class="timeline-item-horizontal">
                            <div class="timeline-date">${escapeHtml(item.date)}</div>
                            <div class="timeline-version">${escapeHtml(item.version)}</div>
                            <div class="timeline-event">${escapeHtml(item.event)}</div>
                        </div>
                    `;
                });
                modalHTML += '</div>';
            }

            modalHTML += '</div>';

            modalHTML += `
                <div class="modal-actions">
                    <button class="btn btn-ghost" onclick="toggleFavorite('${escapeHtml(categoryName)}', '${escapeHtml(toolName)}', event); this.innerHTML = favorites.includes('${favKey}') ? '★ Favorited' : '☆ Add to Favorites'">
                        ${isFav ? '★ Favorited' : '☆ Add to Favorites'}
                    </button>
                    <a href="${tool.url}" target="_blank" class="btn btn-primary">Visit Website →</a>
                </div>
            `;

            document.getElementById('modalContent').innerHTML = modalHTML;
            document.getElementById('toolModal').showModal();
        }

        function showFavorites() {
            const modal = document.getElementById('favoritesModal');
            const content = document.getElementById('favoritesContent');
            const countEl = document.getElementById('favoritesCount');

            if (favorites.length === 0) {
                countEl.textContent = 'No saved tools yet';
                content.innerHTML = '<div class="text-center py-12"><p class="text-lg opacity-60">No favorites yet.</p><p class="text-sm opacity-50 mt-2">Click the ★ on any tool card to add it to your favorites!</p></div>';
            } else {
                countEl.textContent = favorites.length + ' saved tool' + (favorites.length === 1 ? '' : 's');

                const favTools = [];
                favorites.forEach(favKey => {
                    const [catName, toolName] = favKey.split('::');
                    const category = toolsData.categories.find(c => c.name === catName);
                    if (category) {
                        const tool = category.tools.find(t => t.name === toolName);
                        if (tool) {
                            favTools.push({tool, category});
                        }
                    }
                });

                content.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${favTools.map(({tool, category}) => createToolCard(tool, category)).join('')}
                    </div>
                `;
            }

            modal.showModal();
        }

        function loadTools() {
            fetch('ai-tools-directory.json')
                .then(response => response.json())
                .then(data => {
                    toolsData = data;
                    renderTools();
                    populateCategoryFilters();
                    updateToolCount();
                })
                .catch(error => {
                    console.error('Error loading tools:', error);
                    document.getElementById('toolsContainer').innerHTML = 
                        '<div class="alert alert-error"><span>Error loading tools. Please refresh the page.</span></div>';
                });
        }

        function renderTools() {
            const container = document.getElementById('toolsContainer');
            container.innerHTML = '';

            let visibleCount = 0;

            toolsData.categories.forEach(category => {
                const filteredTools = category.tools.filter(tool => {
                    const categoryMatch = activeCategory === 'all' || category.name === activeCategory;

                    const badgeMatch = activeBadges.length === 0 || activeBadges.every(badge => {
                        if (badge === 'recommended') return tool.badges && tool.badges.includes('recommended');
                        if (badge === 'new') return tool.cornerBadge && tool.cornerBadge.toLowerCase() === 'new';
                        if (badge === 'popular') return tool.cornerBadge && tool.cornerBadge.toLowerCase() === 'popular';
                        if (badge === 'open-source') return tool.badges && tool.badges.includes('open-source');
                        if (badge === 'free') return tool.pricing && tool.pricing.toLowerCase().includes('free');
                        return false;
                    });

                    return categoryMatch && badgeMatch;
                });

                if (filteredTools.length > 0) {
                    visibleCount += filteredTools.length;

                    const colorClass = 'color-' + (category.colorScheme || 'primary');
                    const categorySection = document.createElement('div');
                    categorySection.className = 'mb-12';
                    categorySection.setAttribute('data-category-section', category.name);

                    categorySection.innerHTML = `
                        <div class="category-header ${colorClass}">
                            <h2>${escapeHtml(category.name)}</h2>
                        </div>
                        <div class="category-tools-grid">
                            ${filteredTools.map(tool => createToolCard(tool, category)).join('')}
                        </div>
                    `;

                    container.appendChild(categorySection);
                }
            });

            const noResults = document.getElementById('noResults');
            if (visibleCount === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }

            updateResultCount(visibleCount);
        }

        function populateCategoryFilters() {
            const container = document.getElementById('categoryFilters');
            const allChip = container.querySelector('[data-category="all"]');

            toolsData.categories.forEach(category => {
                const chip = document.createElement('div');
                chip.className = 'filter-chip';
                chip.setAttribute('data-category', category.name);
                chip.textContent = category.name;
                chip.onclick = () => filterByCategory(category.name);
                container.appendChild(chip);
            });
        }

        function filterByCategory(categoryName) {
            activeCategory = categoryName;

            document.querySelectorAll('.filter-chip').forEach(chip => {
                if (chip.getAttribute('data-category') === categoryName) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });

            renderTools();
            updateClearButton();
        }

        function filterByBadge(badgeName) {
            const chip = document.querySelector(`[data-badge="${badgeName}"]`);
            if (!chip) return;

            if (activeBadges.includes(badgeName)) {
                activeBadges = activeBadges.filter(b => b !== badgeName);
                chip.classList.remove('active');
            } else {
                activeBadges.push(badgeName);
                chip.classList.add('active');
            }

            renderTools();
            updateClearButton();
        }

        document.querySelectorAll('.badge-chip').forEach(chip => {
            chip.onclick = () => filterByBadge(chip.getAttribute('data-badge'));
        });

        function clearAllFilters() {
            activeCategory = 'all';
            activeBadges = [];

            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.classList.remove('active');
                if (chip.getAttribute('data-category') === 'all') {
                    chip.classList.add('active');
                }
            });

            document.querySelectorAll('.badge-chip').forEach(chip => {
                chip.classList.remove('active');
            });

            renderTools();
            updateClearButton();
        }

        document.getElementById('clearFilters').onclick = clearAllFilters;

        function updateClearButton() {
            const clearBtn = document.getElementById('clearFilters');
            if (activeCategory !== 'all' || activeBadges.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }

        function updateResultCount(count) {
            const resultCount = document.getElementById('resultCount');
            if (activeCategory !== 'all' || activeBadges.length > 0) {
                resultCount.textContent = `${count} result${count !== 1 ? 's' : ''}`;
            } else {
                resultCount.textContent = '';
            }
        }

        function updateToolCount() {
            let totalTools = 0;
            toolsData.categories.forEach(category => {
                totalTools += category.tools.length;
            });

            document.getElementById('toolCount').textContent = totalTools;
            document.getElementById('categoryCount').textContent = toolsData.categories.length;
        }

        document.getElementById('currentYear').textContent = new Date().getFullYear();

        initializeThemeDropdown();
        updateFavCount();
        loadTools();
    </script>
</body>
</html>
