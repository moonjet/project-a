<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.6.0/dist/full.min.css" rel="stylesheet" />
    <style>
        /* Premium Background Gradients */
        [data-theme="light"] body {
            background: linear-gradient(135deg, 
                #f5f7fa 0%, 
                #e8eef5 25%, 
                #dfe7f2 50%, 
                #d6dfe9 75%, 
                #cdd7e0 100%);
            background-attachment: fixed;
        }
        
        [data-theme="dark"] body {
            background: linear-gradient(135deg, 
                #0f172a 0%, 
                #1e293b 25%, 
                #334155 50%, 
                #1e293b 75%, 
                #0f172a 100%);
            background-attachment: fixed;
        }

        /* Sleek Category Headers */
        .category-header {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-left-width: 4px;
        }

        [data-theme="dark"] .category-header {
            background: rgba(30, 41, 59, 0.3);
        }

        .category-header h2 {
            font-weight: 700;
            font-size: 1.75rem;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        [data-theme="dark"] .category-header h2 {
            background: linear-gradient(135deg, #818cf8 0%, #a78bfa 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Category-specific left border colors */
        .category-chat { border-left-color: #6366f1; }
        .category-dev { border-left-color: #10b981; }
        .category-video { border-left-color: #f97316; }
        .category-voice { border-left-color: #a855f7; }
        .category-workflow { border-left-color: #84cc16; }

        /* Subtle transparent gradient buttons (increased opacity by 60% = reduced to 40% of original) */
        .btn-visit {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.03) 0%, rgba(0, 0, 0, 0.05) 100%);
            border: 1px solid rgba(0, 0, 0, 0.04);
            backdrop-filter: blur(8px);
            color: inherit;
            font-weight: 600;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-visit:hover {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.06) 0%, rgba(0, 0, 0, 0.09) 100%);
            border-color: rgba(0, 0, 0, 0.08);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] .btn-visit {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        [data-theme="dark"] .btn-visit:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.09) 100%);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.05);
        }

        .btn-learn-more {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.02) 0%, rgba(0, 0, 0, 0.03) 100%);
            border: 1px solid rgba(0, 0, 0, 0.03);
            backdrop-filter: blur(8px);
            color: inherit;
            font-weight: 500;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-learn-more:hover {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0.07) 100%);
            border-color: rgba(0, 0, 0, 0.06);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] .btn-learn-more {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        [data-theme="dark"] .btn-learn-more:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.07) 100%);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 2px 6px rgba(255, 255, 255, 0.04);
        }

        .star-rating { color: #fbbf24; }
        .tool-card { min-height: 180px; }
        .modal-box { max-width: 800px; }

        /* Card enhancements */
        .card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        [data-theme="dark"] .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Reduced line height for compact cards */
        .card p, .card a {
            line-height: 1.3;
        }
    </style>
</head>
<body class="min-h-screen">
    
    <!-- Theme Toggle -->
    <div class="fixed top-4 right-4 z-50">
        <label class="swap swap-rotate btn btn-circle btn-ghost backdrop-blur-md bg-base-100/50">
            <input type="checkbox" id="themeToggle" />
            <svg class="swap-off fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/></svg>
            <svg class="swap-on fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/></svg>
        </label>
    </div>

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <div class="text-center mb-12">
            <h1 class="text-6xl font-bold mb-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">
                AI Tools Directory
            </h1>
            <p class="text-xl text-base-content/70">Curated collection of AI tools and services</p>
        </div>
        
        <!-- Favorites Section -->
        <div id="favoritesSection" class="mb-12 hidden">
            <h2 class="text-3xl font-bold mb-4 flex items-center gap-2">
                ⭐ Your Favorites
            </h2>
            <div id="favoritesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8"></div>
        </div>

        <!-- All Tools -->
        <div id="toolsContainer"></div>
    </div>

    <!-- Modal Template -->
    <dialog id="toolModal" class="modal">
        <div class="modal-box">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
            </form>
            <div id="modalContent"></div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script>
        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-theme', savedTheme);
        themeToggle.checked = savedTheme === 'dark';
        
        themeToggle.addEventListener('change', () => {
            const newTheme = themeToggle.checked ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // Favorites management
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

        function toggleFavorite(toolName, categoryName) {
            const favKey = `${categoryName}::${toolName}`;
            const index = favorites.indexOf(favKey);
            
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(favKey);
            }
            
            localStorage.setItem('favorites', JSON.stringify(favorites));
            loadTools();
        }

        function isFavorite(toolName, categoryName) {
            return favorites.includes(`${categoryName}::${toolName}`);
        }

        // Category styling mapping
        const categoryStyles = {
            'AI Chat & LLMs': 'category-chat',
            'AI Development Tools': 'category-dev',
            'Video & Image Production': 'category-video',
            'TTS & Voice AI': 'category-voice',
            'Workflow & Automation': 'category-workflow'
        };

        // Badge label mapping
        const badgeLabels = {
            'new': 'New',
            'recommended': 'Top',
            'popular': 'Popular',
            'free': 'Free',
            'paid': 'Paid',
            'open-source': 'Open',
            'macos': 'macOS',
            'windows': 'Windows',
            'web': 'Web',
            'desktop': 'Desktop',
            'plugin': 'Plugin',
            'cli': 'CLI',
            'enterprise': 'Enterprise',
            'beta': 'Beta'
        };

        // Badge colors
        const badgeStyles = {
            'new': 'badge-success',
            'recommended': 'badge-primary',
            'popular': 'badge-secondary',
            'free': 'badge-info',
            'paid': 'badge-warning',
            'open-source': 'badge-accent',
            'macos': 'badge-ghost',
            'windows': 'badge-ghost',
            'web': 'badge-ghost',
            'desktop': 'badge-ghost',
            'plugin': 'badge-ghost',
            'cli': 'badge-ghost',
            'enterprise': 'badge-error',
            'beta': 'badge-neutral'
        };

        // Model versions for LLMs
        const modelVersions = {
            'Perplexity': 'Sonar Pro',
            'ChatGPT': 'GPT-4o',
            'Claude': 'Claude 3.7 Sonnet',
            'Google Gemini': 'Gemini 2.0 Flash',
            'Microsoft Copilot': 'GPT-4 Turbo',
            'Mistral Chat': 'Mistral Large 2',
            'DeepSeek': 'DeepSeek V3',
            'Grok': 'Grok 2',
            'Pi': 'Inflection 2.5',
            'You.com': 'GPT-4',
            'HuggingChat': 'Llama 3.3 70B',
            'Character.AI': 'C1.2'
        };

        // Star rating display
        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 >= 0.5;
            let html = '';
            
            for (let i = 0; i < 5; i++) {
                if (i < fullStars) {
                    html += '★';
                } else if (i === fullStars && halfStar) {
                    html += '⯨';
                } else {
                    html += '☆';
                }
            }
            return html;
        }

        // Show modal
        function showToolDetails(tool, category) {
            const modal = document.getElementById('toolModal');
            const content = document.getElementById('modalContent');
            
            const modelVersion = modelVersions[tool.name] ? 
                `<div class="badge badge-neutral badge-outline">Model: ${modelVersions[tool.name]}</div>` : '';
            
            content.innerHTML = `
                <div class="flex items-start gap-4 mb-4">
                    <img src="${tool.thumbnail}" 
                         alt="${tool.name}" 
                         class="w-24 h-24 rounded-lg object-contain bg-base-100/50 p-2"
                         onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(tool.name)}&size=128&background=random'">
                    <div class="flex-1">
                        <h3 class="text-2xl font-bold">${tool.name}</h3>
                        <div class="star-rating text-xl mb-2">${renderStars(tool.rating || 0)}</div>
                        ${modelVersion}
                    </div>
                </div>
                
                <div class="mb-4 flex flex-wrap gap-2">
                    ${(tool.badges || []).map(badge => 
                        `<span class="badge ${badgeStyles[badge] || 'badge-ghost'} badge-lg">${badgeLabels[badge] || badge}</span>`
                    ).join('')}
                </div>
                
                <p class="text-base-content/80 mb-4">${tool.description}</p>
                
                <div class="flex gap-2 mt-6">
                    <a href="${tool.url}" target="_blank" class="btn btn-primary flex-1">Visit Website →</a>
                    <button onclick="toggleFavorite('${tool.name}', '${category.name}')" 
                            class="btn btn-outline ${isFavorite(tool.name, category.name) ? 'btn-warning' : ''}">
                        ${isFavorite(tool.name, category.name) ? '★ Favorited' : '☆ Favorite'}
                    </button>
                </div>
            `;
            
            modal.showModal();
        }

        // Create tool card
        function createToolCard(tool, category) {
            const isFav = isFavorite(tool.name, category.name);
            
            return `
                <div class="card shadow-xl hover:shadow-2xl transition-all duration-300 hover:scale-105 tool-card overflow-hidden">
                    <div class="flex h-full">
                        <!-- Thumbnail (30% width) with Visit button -->
                        <div class="w-[30%] flex-shrink-0 relative flex flex-col">
                            <div class="flex-grow bg-base-100/50 p-2 flex items-center justify-center">
                                <img src="${tool.thumbnail}" 
                                     alt="${tool.name}" 
                                     class="max-w-full max-h-full object-contain"
                                     onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(tool.name)}&size=200&background=random'">
                            </div>
                            <a href="${tool.url}" target="_blank" class="btn btn-visit btn-sm w-full rounded-none rounded-bl-lg">
                                Visit
                            </a>
                            <button onclick="event.stopPropagation(); toggleFavorite('${tool.name}', '${category.name}')" 
                                    class="absolute top-2 left-2 btn btn-circle btn-xs ${isFav ? 'btn-warning' : 'btn-ghost bg-base-100/80'}">
                                ${isFav ? '★' : '☆'}
                            </button>
                        </div>
                        
                        <!-- Content (70% width) -->
                        <div class="flex-1 p-3 flex flex-col relative">
                            <!-- Title -->
                            <h3 class="font-bold text-lg mb-1">${tool.name}</h3>
                            
                            <!-- Badges (below name, above description) -->
                            <div class="flex gap-1 flex-wrap mb-2">
                                ${(tool.badges || []).slice(0, 4).map(badge => 
                                    `<span class="badge ${badgeStyles[badge] || 'badge-ghost'} badge-xs">${badgeLabels[badge] || badge}</span>`
                                ).join('')}
                            </div>
                            
                            <!-- Description -->
                            <p class="text-sm text-base-content/70 mb-1 flex-grow">${tool.description}</p>
                            
                            <!-- URL -->
                            <a href="${tool.url}" target="_blank" class="text-[13px] text-primary hover:underline truncate block mb-2">
                                ${tool.url.replace(/^https?:\/\/(www\.)?/, '')}
                            </a>
                            
                            <!-- Learn More button (bottom right corner) -->
                            <div class="flex justify-end -mr-3 -mb-3">
                                <button onclick='showToolDetails(${JSON.stringify(tool).replace(/'/g, "&#39;")}, ${JSON.stringify(category).replace(/'/g, "&#39;")})' 
                                        class="btn btn-learn-more btn-sm rounded-none rounded-br-lg">
                                    Learn More
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Load and render tools
        function loadTools() {
            fetch('ai-tools-directory.json')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('toolsContainer');
                    const favSection = document.getElementById('favoritesSection');
                    const favGrid = document.getElementById('favoritesGrid');
                    
                    container.innerHTML = '';
                    favGrid.innerHTML = '';
                    
                    // Render favorites
                    if (favorites.length > 0) {
                        favSection.classList.remove('hidden');
                        data.categories.forEach(category => {
                            category.tools.forEach(tool => {
                                if (isFavorite(tool.name, category.name)) {
                                    favGrid.innerHTML += createToolCard(tool, category);
                                }
                            });
                        });
                    } else {
                        favSection.classList.add('hidden');
                    }
                    
                    // Render all categories
                    data.categories.forEach(category => {
                        const categoryClass = categoryStyles[category.name] || 'category-chat';
                        
                        const categorySection = document.createElement('div');
                        categorySection.className = 'mb-12';
                        categorySection.innerHTML = `
                            <div class="category-header ${categoryClass} rounded-r-xl py-3 px-6 mb-6">
                                <h2 class="mb-1">${category.name}</h2>
                                <p class="text-base-content/70">${category.description}</p>
                            </div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                ${category.tools.map(tool => createToolCard(tool, category)).join('')}
                            </div>
                        `;
                        
                        container.appendChild(categorySection);
                    });
                })
                .catch(error => console.error('Error loading tools:', error));
        }

        // Initialize
        loadTools();
    </script>
</body>
</html>
